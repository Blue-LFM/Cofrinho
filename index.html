.big{font-size:44px;font-weight:800;line-height:1.1}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:130px}
.muted{color:var(--muted);font-size:14px}
.pos{color:var(--brand)}.neg{color:var(--pink)}
label{display:block;font-size:14px;font-weight:500;margin-bottom:8px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin-top:4px}

.cat .bar{margin:0}.cat .bar i{background:var(--brand)}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bd{border:1px dashed var(--line);border-radius:12px;padding:12px;opacity:.55}
.bd.on{opacity:1;border:2px solid var(--coin)}
.msg{background:var(--brand);color:var(--on-brand);padding:10px 14px;border-radius:10px;margin-bottom:12px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

$('#nav').onclick=function(e){var t=e.target.getAttribute('data-t');if(t){tab=t;render()}};

 var r=mTx('r'),g=mTx('g'),mx=Math.max.apply(null,CATS.map(function(c){return mTx('g',c)}).concat([1]));
 var h='<div class="card"><label>Mês<input type="month" id="mes" value="'+MES+'" onchange="if(this.value){MES=this.value;render()}"></label><div class="muted">Saldo de '+mesNome(MES)+'</div><div class="big '+(r-g>=0?'pos':'neg')+'">'+brl(r-g)+'</div>'+
 '<div class="row" style="margin-top:12px"><div><div class="muted">Receitas</div><b class="pos">'+brl(r)+'</b></div><div><div class="muted">Gastos</div><b class="neg">'+brl(g)+'</b></div><div><div class="muted">Saldo acumulado</div><b>'+brl(sum('r')-sum('g'))+'</b></div></div></div>';

 h+='<div class="card"><h3>Para onde vai o dinheiro</h3>';
 if(!g)h+='<p class="muted">Sem gastos neste mês.</p>';
 CATS.forEach(function(c){var v=mTx('g',c);if(v)h+='<div class="cat"><span>'+c+'</span><div class="bar"><i style="width:'+v/mx*100+'%"></i></div><span>'+brl(v)+'</span></div>'});
 h+='</div>';

 return h}
function vLimites(){
 var h='<div class="card"><h3>Definir limite mensal</h3><p class="muted">Você recebe um aviso ao chegar em 80% e ao passar do limite.</p><form id="fl" style="margin-top:12px"><div class="row"><label>Categoria<select name="c">'+opts(CATS)+'</select></label><label>Limite por mês (R$)<input name="v" type="number" min="1" step="0.01" required></label></div><button class="btn">Salvar limite</button></form></div>';
 var L=lims();
 if(!L.length)h+='<p class="muted">Nenhum limite definido ainda.</p>';
 L.forEach(function(x){var col=x.p>=1?'var(--pink)':x.p>=.8?'var(--coin)':'var(--brand)';
  h+='<div class="card"><div class="item" style="border:0;padding:0"><h3>'+x.c+'</h3><span>'+brl(x.s)+' / '+brl(x.l)+'</span></div><div class="bar"><i style="width:'+Math.min(100,x.p*100)+'%;background:'+col+'"></i></div><div class="item" style="border:0;padding:8px 0 0"><span class="muted">'+Math.round(x.p*100)+'% usado em '+mesNome(MES)+'</span><button class="btn alt" onclick="delLim(\''+x.c+'\')">Remover</button></div></div>'});
 return h}
function delLim(c){delete S.lim[c];save();render()}
function chk(t,c,v){if(t!=='g'||!S.lim||!S.lim[c])return;var l=S.lim[c],m=today().slice(0,7),sp=S.tx.filter(function(x){return x.t==='g'&&x.c===c&&x.d.slice(0,7)===m}).reduce(function(a,x){return a+x.v},0),b=sp-v;
 if(sp>l&&b<=l)warn('Limite de '+c+' estourado: '+brl(sp)+' de '+brl(l)+'.');else if(sp>=l*.8&&b<l*.8)warn('Atenção: você já usou '+Math.round(sp/l*100)+'% do limite de '+c+'.')}
function demo(){var d=today();
 S.tx=[{id:1,t:'r',v:1200,c:'Outros',d:d,n:'Estágio'},{id:2,t:'g',v:380,c:'Moradia',d:d,n:'Aluguel (parte)'},{id:3,t:'g',v:210,c:'Alimentação',d:d,n:'Mercado'},{id:4,t:'g',v:90,c:'Lazer',d:d,n:'Cinema e lanche'},{id:5,t:'g',v:120,c:'Transporte',d:d,n:'Ônibus'}];
 S.goals=[{id:1,n:'Notebook',alvo:2500,atual:300}];save();render()}
var IMP=null;
function num(s){s=String(s).replace(/R\$|\s/g,'');var neg=/-/.test(s)||/^\(.*\)$/.test(s);s=s.replace(/[()\-+]/g,'');if(s.indexOf(',')>-1)s=s.replace(/\./g,'').replace(',','.');var v=parseFloat(s);return isNaN(v)?null:(neg?-v:v)}
function dt(s){s=String(s).trim();var m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);if(m)return m[3]+'-'+m[2]+'-'+m[1];m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/^(\d{4})(\d{2})(\d{2})/);return m?m[1]+'-'+m[2]+'-'+m[3]:null}
function csvRows(t){var f=t.split(/\r?\n/)[0]||'',sep=(f.split(';').length>f.split(',').length)?';':',',rows=[],r=[],c='',q=false;
 for(var i=0;i<t.length;i++){var ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch=='"')q=true;
  else if(ch==sep){r.push(c);c=''}
  else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';rows.push(r);r=[]}
  else c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}
 return rows.filter(function(x){return x.join('').trim()})}
function parseCsv(t){var R=csvRows(t),hi=-1,ix={};
 for(var i=0;i<Math.min(R.length,15);i++){var H=R[i].map(function(x){return x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()});
  var d=H.findIndex(function(x){return /^(data|date)/.test(x)}),v=H.findIndex(function(x){return /^(valor|amount|value)/.test(x)}),n=H.findIndex(function(x){return /(descri|historico|lancamento|title|memo|estabelecimento|nome)/.test(x)});
  if(d>-1&&v>-1){hi=i;ix={d:d,v:v,n:n};break}}
 if(hi<0)return null;
 return R.slice(hi+1).map(function(x){var d=dt(x[ix.d]||''),v=num(x[ix.v]||'');if(!d||v===null||v===0)return null;return{d:d,v:v,n:(ix.n>-1?x[ix.n]:'')||''}}).filter(Boolean)}

function vImp(){var inv=IMP.inv,R=IMP.rows,g=0,r=0;function tp(x){return (inv?x.v>0:x.v<0)?'g':'r'}
 R.forEach(function(x){if(tp(x)==='g')g+=Math.abs(x.v);else r+=Math.abs(x.v)});
 var h='<div class="card"><h3>Prévia da importação</h3><p class="muted">'+R.length+' lançamentos encontrados: gastos de '+brl(g)+' e receitas de '+brl(r)+'. As categorias são sugeridas automaticamente e podem ficar como "Outros".</p><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto;margin:0" '+(inv?'checked':'')+' onchange="IMP.inv=this.checked;render()"> Valores positivos são gastos (fatura de cartão)</label>';
 R.slice(0,8).forEach(function(x){h+='<div class="item"><div>'+esc(x.n||'(sem descrição)')+'<div class="muted">'+x.c+' - '+x.d+'</div></div><b class="'+(tp(x)==='r'?'pos':'neg')+'">'+(tp(x)==='r'?'+':'-')+brl(Math.abs(x.v))+'</b></div>'});
 if(R.length>8)h+='<p class="muted">... e mais '+(R.length-8)+'.</p>';
 return h+'<div class="row" style="margin-top:12px"><button class="btn" onclick="impOk()">Importar tudo</button><button class="btn alt" onclick="IMP=null;render()">Cancelar</button></div></div>'}
function impOk(){var seen={};S.tx.forEach(function(x){seen[x.d+'|'+x.v+'|'+x.t+'|'+(x.n||x.c)]=1});var add=0,inv=IMP.inv;
 IMP.rows.forEach(function(x,i){var t=(inv?x.v>0:x.v<0)?'g':'r',v=Math.abs(x.v);if(seen[x.d+'|'+v+'|'+t+'|'+(x.n||x.c)])return;S.tx.push({id:Date.now()+i,t:t,v:v,c:x.c,d:x.d,n:x.n});add++});
 var sk=IMP.rows.length-add;MES=IMP.rows.map(function(x){return x.d}).sort().pop().slice(0,7);IMP=null;save();render();
 if(add)addXp(10,add+' lançamentos importados'+(sk?' ('+sk+' repetidos ignorados)':''));else say('Nada novo: todos já estavam registrados.')}
var IMPCARD='<div class="card"><h3>Importar extrato</h3><p class="muted">Baixe o extrato no app do seu banco (CSV ou OFX) e envie aqui. O arquivo é lido no seu navegador; só os lançamentos viram dados da sua conta.</p><input type="file" id="fi" accept=".csv,.ofx,.txt"></div>';
function vLanc(){
 var h=(IMP?vImp():IMPCARD)+'<div class="card"><h3>Novo lançamento</h3><form id="f"><div class="row"><label>Tipo<select name="t"><option value="g">Gasto</option><option value="r">Receita</option></select></label><label>Valor (R$)<input name="v" type="number" step="0.01" min="0.01" required></label></div>'+
 '<div class="row"><label>Categoria<select name="c">'+opts(CATS)+'</select></label><label>Descrição<input name="n" maxlength="40" placeholder="Ex.: almoço"></label></div><button class="btn">Salvar lançamento</button></form></div>';
 h+='<div class="card"><h3>Histórico</h3>';
 if(!S.tx.length)h+='<p class="muted">Nenhum lançamento. Cada registro vale 10 XP.</p>';
 S.tx.slice().reverse().forEach(function(x){h+='<div class="item"><div>'+esc(x.n||x.c)+'<div class="muted">'+x.c+' - '+x.d+'</div></div><div><b class="'+(x.t==='r'?'pos':'neg')+'">'+(x.t==='r'?'+':'-')+brl(x.v)+'</b> <button class="btn alt" aria-label="Excluir lançamento" onclick="delTx('+x.id+')">Excluir</button></div></div>'});
 return h+'</div>'}
function delTx(id){S.tx=S.tx.filter(function(x){return x.id!==id});save();render()}
function vMetas(){
 var h='<div class="card"><h3>Nova meta</h3><form id="fg"><div class="row"><label>Nome<input name="n" maxlength="30" placeholder="Ex.: notebook" required></label><label>Valor alvo (R$)<input name="a" type="number" min="1" step="0.01" required></label></div><button class="btn">Criar meta</button></form></div>';
 if(!S.goals.length)h+='<p class="muted">Crie sua primeira meta de economia.</p>';
 S.goals.forEach(function(g){var p=Math.min(100,g.atual/g.alvo*100),ok=g.atual>=g.alvo;
  h+='<div class="card"><div class="item" style="border:0;padding:0"><h3>'+esc(g.n)+(ok?' (concluída)':'')+'</h3><span>'+brl(g.atual)+' / '+brl(g.alvo)+'</span></div><div class="bar"><i style="width:'+p+'%"></i></div>'+
  (ok?'':'<form class="dep" data-id="'+g.id+'" style="display:flex;gap:8px;margin-top:10px"><input name="v" type="number" min="0.01" step="0.01" placeholder="Valor a guardar" aria-label="Valor a guardar" required><button class="btn">Guardar</button></form>')+'</div>'});
 return h}
function vMiss(){
 var h='<p class="muted">Missões de hoje. Conclua e resgate o XP.</p>';
 MS.forEach(function(m){var done=S.claimed.indexOf(m.id)>-1,ok=m.ok();
  h+='<div class="card item"><div><b>'+m.n+'</b><div class="muted">Progresso: '+m.p()+' - '+m.xp+' XP</div></div><button class="btn" '+(done||!ok?'disabled':'')+' onclick="claim(\''+m.id+'\')">'+(done?'Resgatada':ok?'Resgatar':'Em andamento')+'</button></div>'});
 return h}
function claim(id){var m=MS.filter(function(x){return x.id===id})[0];if(S.claimed.indexOf(id)>-1||!m.ok())return;S.claimed.push(id);addXp(m.xp,'missão concluída');render()}
function vSim(){
 return '<div class="card"><h3>Quanto vou ter?</h3><div class="row"><label>Guardo por mês (R$)<input id="sm" type="number" min="1" value="50"></label><label>Meses<input id="sn" type="number" min="1" max="600" value="12"></label><label>Rendimento ao mês (%)<input id="st" type="number" min="0" step="0.1" value="0.8"></label></div><button class="btn" onclick="calc()">Calcular</button><div id="sr" style="margin-top:14px"></div><p class="muted">Simulação educativa com taxa fixa informada por você. Não é recomendação de investimento.</p></div>'}
function calc(){var m=+$('#sm').value,n=+$('#sn').value,t=+$('#st').value/100;if(!(m>0&&n>0))return;
 var f=t?m*((Math.pow(1+t,n)-1)/t):m*n,inv=m*n;
 $('#sr').innerHTML='<div class="muted">Em '+n+' meses você teria</div><div class="big pos">'+brl(f)+'</div><div class="muted">Você guardou '+brl(inv)+' e o rendimento somou '+brl(f-inv)+'.</div>';
 if(!S.sim){S.sim=true;addXp(10,'primeira simulação')}}
function vConq(){
 return '<div class="badges">'+BD.map(function(b){var on=b[2]();return '<div class="bd'+(on?' on':'')+'"><b>'+b[0]+'</b><div class="muted">'+b[1]+'</div>'+(on?'<div class="pos">Conquistada</div>':'')+'</div>'}).join('')+'</div>'}
function render(){head();nav();
 $('#main').innerHTML={resumo:vResumo,lanc:vLanc,metas:vMetas,limites:vLimites,missoes:vMiss,sim:vSim,conq:vConq}[tab]();
 var f=$('#f');if(f)f.onsubmit=function(e){e.preventDefault();var d=new FormData(f);
  S.tx.push({id:Date.now(),t:d.get('t'),v:+d.get('v'),c:d.get('c'),d:today(),n:d.get('n')});save();addXp(10,'lançamento registrado');render();chk(d.get('t'),d.get('c'),+d.get('v'))};
 var fi=$('#fi');if(fi)fi.onchange=function(){readFile(fi.files[0])};
 var fl=$('#fl');if(fl)fl.onsubmit=function(e){e.preventDefault();var d=new FormData(fl);S.lim=S.lim||{};S.lim[d.get('c')]=+d.get('v');save();render()};
 var fg=$('#fg');if(fg)fg.onsubmit=function(e){e.preventDefault();var d=new FormData(fg);
  S.goals.push({id:Date.now(),n:d.get('n'),alvo:+d.get('a'),atual:0});save();render()};
 document.querySelectorAll('.dep').forEach(function(f){f.onsubmit=function(e){e.preventDefault();
  var g=S.goals.filter(function(x){return x.id==f.getAttribute('data-id')})[0],v=+new FormData(f).get('v'),was=g.atual>=g.alvo;
  g.atual+=v;S.dep=true;save();render();addXp(g.atual>=g.alvo&&!was?50:5,g.atual>=g.alvo&&!was?'meta concluída':'depósito na meta')}})}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&sb&&UID&&!pend)refresh()});
start();
</script>
</body>
</html>
